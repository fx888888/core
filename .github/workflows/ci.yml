name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check site/app.js
      - run: npx hardhat compile
      - run: npx hardhat test